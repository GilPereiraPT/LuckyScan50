name: luckyscan50
description: Carteira local independente para apostas portuguesas.
publish_to: none
version: 0.2.8+10
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.4
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  http: ^1.5.0
  intl: ^0.20.2
  cryptography: ^2.7.0
  image_picker: ^1.2.0
  google_mlkit_text_recognition: ^0.15.0
  file_picker: ^10.3.3
  share_plus: ^11.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/luckyscan50-logo.webp
    - assets/branding/luckyscan50-banner.webp
    - assets/results/recent_official.json
