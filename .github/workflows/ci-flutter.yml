name: Flutter Android CI
on:
  push:
    paths: ['app/**', '.github/workflows/ci-flutter.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/ci-flutter.yml']
permissions:
  contents: read
jobs:
  test-and-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: LuckyScan50-release-test-arm64
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14
