name: Flutter Android CI
on:
  workflow_dispatch:
  push:
    branches: ['codex/luckyscan50-android-wallet']
    paths: ['app/**', 'tools/verify_apk.py', '.github/workflows/ci-flutter.yml']
  pull_request:
    paths: ['app/**', 'tools/verify_apk.py', '.github/workflows/ci-flutter.yml']
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Reject private receipt photographs in distributable builds
        run: |
          if find assets/private_receipts -type f ! -name README.txt | grep -q .; then
            echo "Private receipt photographs must not enter CI artifacts."
            exit 1
          fi
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Build ARM64 debug APK (not a production release)
        env:
          BUILD_SHA: ${{ github.sha }}
        run: flutter build apk --debug --target-platform android-arm64 --dart-define=LUCKYSCAN_BUILD_SHA="$BUILD_SHA"
      - name: Verify actual APK, signature, ABI and 16 KB alignment
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BUILD_TOOLS=$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          python3 ../tools/verify_apk.py build/app/outputs/flutter-apk/app-debug.apk --build-tools "$BUILD_TOOLS"
      - name: Distribution blocked pending real Android OCR evidence
        run: |
          echo "No APK is uploaded: both real receipt orientations and Android autofill must be demonstrated first."
