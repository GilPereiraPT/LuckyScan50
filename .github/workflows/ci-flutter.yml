name: Flutter Android CI
on:
  workflow_dispatch:
  push:
    branches: ['codex/luckyscan50-android-wallet']
    paths: ['app/**', 'qa/**', 'tools/run_flutter_qa.py', 'tools/verify_apk.py', '.github/workflows/ci-flutter.yml']
  pull_request:
    paths: ['app/**', 'qa/**', 'tools/run_flutter_qa.py', 'tools/verify_apk.py', '.github/workflows/ci-flutter.yml']
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test-and-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test ../qa/android/integration_test ../qa/android/test_driver ../qa/host
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Test SQLite persistence in an isolated desktop workspace
        run: python3 ../tools/run_flutter_qa.py host
      - name: Build ARM64 diagnostic APK (optimized; test signature)
        env:
          BUILD_SHA: ${{ github.sha }}
        run: flutter build apk --release --target-platform android-arm64 --dart-define=LUCKYSCAN_BUILD_SHA="$BUILD_SHA"
      - name: Verify actual APK, signature, ABI and 16 KB alignment
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BUILD_TOOLS=$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          python3 ../tools/verify_apk.py build/app/outputs/flutter-apk/app-release.apk --build-tools "$BUILD_TOOLS"
      - name: Upload diagnostic APK from the development branch
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/codex/luckyscan50-android-wallet'
        uses: actions/upload-artifact@v4
        with:
          name: LuckyScan50-diagnostic-arm64-${{ github.sha }}
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/flutter-apk/app-release.apk.sha256
            app/build/app/outputs/flutter-apk/app-release.verification.json
          if-no-files-found: error
          retention-days: 14
      - name: Record validation scope
        run: echo "Diagnostic build only. Real receipt OCR and Android autofill remain unvalidated until the private acceptance run passes."
