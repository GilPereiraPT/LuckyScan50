name: Python API CI
on:
  push:
    paths: ['api-python/**', '.github/workflows/ci-python.yml']
  pull_request:
    paths: ['api-python/**', '.github/workflows/ci-python.yml']
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r api-python/requirements.txt
      - run: python -m unittest discover -s api-python -p 'test_*.py'
        working-directory: .
