name: Signed APK (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true
      - name: Prepare private signing (never print secrets)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for var in KEYSTORE_B64 STORE_PASS KEY_ALIAS KEY_PASS; do
            if [[ -z "${!var}" ]]; then echo "::error::Missing required signing secret: $var"; exit 1; fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 --decode > app/android/luckyscan50-upload.jks
          chmod 600 app/android/luckyscan50-upload.jks
          {
            echo "storeFile=luckyscan50-upload.jks"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > app/android/key.properties
          chmod 600 app/android/key.properties
          keytool -list -keystore app/android/luckyscan50-upload.jks -storepass "$STORE_PASS" -alias "$KEY_ALIAS" > /dev/null
      - name: Flutter dependencies
        working-directory: app
        run: flutter pub get
      - name: Generate Android launcher icons from LuckyScan50 logo
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path("app/assets/branding/luckyscan50-logo.webp")
          image = Image.open(source).convert("RGBA")
          for density, size in {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}.items():
              output = Path(f"app/android/app/src/main/res/mipmap-{density}/ic_launcher.png")
              output.parent.mkdir(parents=True, exist_ok=True)
              image.resize((size, size), Image.Resampling.LANCZOS).save(output)
          PY
      - name: Build signed arm64 APK only
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64
      - name: Verify APK signature and stage artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          mkdir -p signed-output
          cp "$APK" signed-output/LuckyScan50-signed-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LuckyScan50-signed-arm64-APK
          path: signed-output/LuckyScan50-signed-arm64.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing files
        if: always()
        shell: bash
        run: rm -f app/android/luckyscan50-upload.jks app/android/key.properties
