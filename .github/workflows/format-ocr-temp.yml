name: Temporary Dart format for OCR branch
on:
  push:
    branches: ['feat/ocr-reliability-20261024']
    paths: ['.github/workflows/format-ocr-temp.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Format only OCR files
        working-directory: app
        run: dart format lib/data/receipt_scanner.dart lib/domain/receipt_numbered_bets.dart test/receipt_numbered_bets_test.dart test/receipt_orientation_selection_test.dart
      - name: Commit formatting
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/data/receipt_scanner.dart app/lib/domain/receipt_numbered_bets.dart app/test/receipt_numbered_bets_test.dart app/test/receipt_orientation_selection_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "style(ocr): apply dart format to new recognition improvements"
            git push origin HEAD:feat/ocr-reliability-20261024
          fi
