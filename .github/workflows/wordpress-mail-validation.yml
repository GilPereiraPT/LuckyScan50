name: WordPress mail bridge validation
on:
  push:
    branches: ['feat/manual-draw-picker']
    paths: ['wordpress/**', 'api-python/**', '.github/workflows/wordpress-mail-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s api-python -v
      - run: php -l wordpress/luckyscan50-mail-bridge/luckyscan50-mail-bridge.php
      - run: php wordpress/tests/mail_bridge_test.php
