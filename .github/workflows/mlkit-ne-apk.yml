name: LuckyScan50 ML Kit N-E diagnostic APK

on:
  push:
    branches:
      - codex/mlkit-ne-line-structure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Normalize Dart formatting in CI workspace
        working-directory: app
        run: dart format lib test
      - name: Analyze Flutter sources
        working-directory: app
        run: flutter analyze
      - name: Run all Flutter unit and widget regressions
        working-directory: app
        run: flutter test
      - name: Generate launcher icons from the bundled LuckyScan50 logo
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path('app/assets/branding/luckyscan50-logo.webp')
          if not source.is_file():
              raise SystemExit('Missing LuckyScan50 brand asset')
          image = Image.open(source).convert('RGBA')
          for density, size in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              target = Path(f'app/android/app/src/main/res/mipmap-{density}/ic_launcher.png')
              image.resize((size, size), Image.Resampling.LANCZOS).save(target)
          PY
      - name: Build smaller arm64 profile APK (ML Kit retained)
        working-directory: app
        run: flutter build apk --profile --target-platform android-arm64
      - name: Record actual APK size
        working-directory: app
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          file = Path('build/app/outputs/flutter-apk/app-profile.apk')
          size = file.stat().st_size
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(f'Profile ARM64 APK: {size:,} bytes ({size / 1048576:.2f} MiB)\\n\\n')
              output.write('Includes real Google ML Kit, but is NOT a privately signed release.\\n')
          PY
      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: LuckyScan50-mlkit-ne-arm64-profile
          path: app/build/app/outputs/flutter-apk/app-profile.apk
          if-no-files-found: error
          retention-days: 7
