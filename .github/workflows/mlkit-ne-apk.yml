name: LuckyScan50 ML Kit N-E diagnostic APK

on:
  push:
    branches:
      - codex/mlkit-ne-line-structure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Check Dart formatting
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze Flutter sources
        working-directory: app
        run: flutter analyze
      - name: Run N/E unit tests
        working-directory: app
        run: flutter test test/receipt_ne_lines_test.dart
      - name: Build diagnostic arm64 APK
        working-directory: app
        run: flutter build apk --debug --target-platform android-arm64
      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: LuckyScan50-mlkit-ne-arm64-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
