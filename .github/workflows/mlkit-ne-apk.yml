name: Manual ARM64 profile diagnostic APK (not private release)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci-flutter.yml
  diagnostic-apk:
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true
      - name: Install locked dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Generate launcher icons from the bundled LuckyScan50 logo
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path('app/assets/branding/luckyscan50-logo.webp')
          if not source.is_file():
              raise SystemExit('Missing LuckyScan50 brand asset')
          image = Image.open(source).convert('RGBA')
          for density, size in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              target = Path(f'app/android/app/src/main/res/mipmap-{density}/ic_launcher.png')
              image.resize((size, size), Image.Resampling.LANCZOS).save(target)
          PY
      - name: Build smaller arm64 profile APK (ML Kit retained)
        working-directory: app
        run: flutter build apk --profile --target-platform android-arm64 --dart-define=LUCKYSCAN_BUILD_SHA="$GITHUB_SHA"
      - name: Install pinned APK verification tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"'
      - name: Verify actual profile APK and record its size
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_apk.py app/build/app/outputs/flutter-apk/app-profile.apk --build-tools "$ANDROID_HOME/build-tools/35.0.0"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          report = json.loads(Path('app/build/app/outputs/flutter-apk/app-profile.verification.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('Commit: ' + os.environ['GITHUB_SHA'] + '\n\n')
              output.write('Manual profile diagnostic; NOT a privately signed release.\n\n')
              for field in ('apk', 'bytes', 'sha256', 'certificateSha256', 'abi', 'signatureVerified', 'elf16KbAligned', 'zip16KbAligned'):
                  output.write(f'- {field}: {report[field]}\n')
              output.write('The bytes and SHA-256 above describe the APK, not the artifact ZIP.\n')
          PYTHON
      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v6
        with:
          name: LuckyScan50-mlkit-ne-arm64-profile
          path: app/build/app/outputs/flutter-apk/app-profile.apk
          if-no-files-found: error
          retention-days: 7
