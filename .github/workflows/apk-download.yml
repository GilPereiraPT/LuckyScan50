name: APK diagnostico descarregavel
on:
  workflow_dispatch:
  push:
    branches:
      - codex/luckyscan50-android-wallet
    paths:
      - .github/workflows/apk-download.yml
      - 'app/lib/**'
      - 'app/test/**'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencias
        run: flutter pub get --enforce-lockfile
      - name: Compilar APK ARM64 diagnostico
        run: flutter build apk --release --target-platform android-arm64 --dart-define=LUCKYSCAN_BUILD_SHA="${GITHUB_SHA}"
      - name: Verificar APK
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          python3 ../tools/verify_apk.py build/app/outputs/flutter-apk/app-release.apk --build-tools "$BUILD_TOOLS"
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: LuckyScan50-diagnostic-arm64
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
