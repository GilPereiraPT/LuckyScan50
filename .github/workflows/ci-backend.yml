name: Backend CI
on:
  push:
    paths: ['backend/**', 'shared/**', '.github/workflows/ci-backend.yml']
  pull_request:
    paths: ['backend/**', 'shared/**', '.github/workflows/ci-backend.yml']
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npm run lint
      - run: npm test
